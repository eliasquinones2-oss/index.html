<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Flash SRS - Direct Rescue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const firebaseConfig = {
            apiKey: "AIzaSyDqk1ojTgEnzsGKnNFphi-CbMPIww43Ewo",
            authDomain: "lumina-flash-6298f.firebaseapp.com",
            projectId: "lumina-flash-6298f",
            storageBucket: "lumina-flash-6298f.firebasestorage.app",
            messagingSenderId: "281445871040",
            appId: "1:281445871040:web:8fad281101f1833c796c25"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [status, setStatus] = useState("");

            useEffect(() => {
                return auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            if (loading) return <div className="p-10 text-center font-medium">Loading app...</div>;
            if (!user) return (
                <div className="p-10 text-center max-w-md mx-auto mt-20 bg-white rounded-xl shadow border">
                    <h1 className="text-xl font-bold mb-2">Lumina Flash</h1>
                    <p className="text-sm text-gray-500 mb-4">Please sign in first.</p>
                    <button onClick={() => auth.signInAnonymously()} className="bg-blue-600 text-white px-4 py-2 rounded font-medium w-full">Sign In</button>
                </div>
            );

            const rescueTargetData = async () => {
                try {
                    setStatus("Targeting source folder...");
                    const usersRef = db.collection('artifacts').doc('lumina-flash-6298f').collection('users');
                    
                    const sourceUserId = "3zQgFMdcOGYS7ytCRnaGwPUFKSl2";
                    const sourceRef = usersRef.doc(sourceUserId);
                    const targetRef = usersRef.doc(user.uid);

                    let count = 0;
                    const collectionsToPull = ['cards', 'sets', 'folders', 'metadata'];
                    
                    for (const colName of collectionsToPull) {
                        const snap = await sourceRef.collection(colName).get();
                        for (const doc of snap.docs) {
                            await targetRef.collection(colName).doc(doc.id).set(doc.data(), { merge: true });
                            count++;
                        }
                    }

                    setStatus(`Rescue Complete! Successfully pulled ${count} items into your account. Refresh your app!`);
                } catch (e) {
                    setStatus("Error during rescue: " + e.message);
                }
            };

            return (
                <div className="p-6 max-w-4xl mx-auto">
                    <div className="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border">
                        <h1 className="text-xl font-bold">Lumina Flash Direct Rescue</h1>
                        <span className="text-xs text-gray-500">ID: {user.uid}</span>
                    </div>

                    <div className="bg-white p-8 rounded-xl shadow-sm border text-center">
                        <h2 className="text-lg font-bold mb-2 text-gray-800">Ready to pull your Anatomy cards?</h2>
                        <p className="text-sm text-gray-500 mb-6">This will copy all cards from your old storage ID directly into your active account.</p>
                        <button onClick={rescueTargetData} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition">
                            Rescue Cards Now
                        </button>
                        {status && <div className="mt-6 p-4 bg-blue-50 text-blue-800 rounded-lg text-sm font-medium">{status}</div>}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
