<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Flash SRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const firebaseConfig = {
            apiKey: "AIzaSyDqk1ojTgEnzsGKnNFphi-CbMPIww43Ewo",
            authDomain: "lumina-flash-6298f.firebaseapp.com",
            projectId: "lumina-flash-6298f",
            storageBucket: "lumina-flash-6298f.firebasestorage.app",
            messagingSenderId: "281445871040",
            appId: "1:281445871040:web:8fad281101f1833c796c25"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                return auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            if (loading) return <div className="p-10 text-center">Loading...</div>;
            if (!user) return (
                <div className="p-10 text-center max-w-md mx-auto mt-20 bg-white rounded-xl shadow">
                    <h1 className="text-xl font-bold mb-4">Lumina Flash</h1>
                    <button onClick={() => auth.signInAnonymously()} className="bg-blue-600 text-white px-4 py-2 rounded">Sign In Anonymously</button>
                </div>
            );

            // Points directly to your artifact database path structure
            const userPath = db.collection('artifacts').doc('lumina-flash-6298f').collection('users').doc(user.uid);

            return (
                <div className="p-6 max-w-4xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-2xl font-bold">Lumina Flash Dashboard</h1>
                        <button onClick={() => auth.signOut()} className="text-sm text-red-500">Sign Out</button>
                    </div>
                    <div className="bg-white p-6 rounded-xl shadow border">
                        <p className="text-gray-600">Connected to cloud successfully! User ID: {user.uid}</p>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
