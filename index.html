<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Flash SRS - Harvester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const firebaseConfig = {
            apiKey: "AIzaSyDqk1ojTgEnzsGKnNFphi-CbMPIww43Ewo",
            authDomain: "lumina-flash-6298f.firebaseapp.com",
            projectId: "lumina-flash-6298f",
            storageBucket: "lumina-flash-6298f.firebasestorage.app",
            messagingSenderId: "281445871040",
            appId: "1:281445871040:web:8fad281101f1833c796c25"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [status, setStatus] = useState("");

            useEffect(() => {
                return auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            if (loading) return <div className="p-10 text-center font-medium">Loading app...</div>;
            if (!user) return (
                <div className="p-10 text-center max-w-md mx-auto mt-20 bg-white rounded-xl shadow border">
                    <h1 className="text-xl font-bold mb-2">Lumina Flash</h1>
                    <p className="text-sm text-gray-500 mb-4">Please sign in to harvest your old data.</p>
                    <button onClick={() => {
                        const email = prompt("Email:");
                        const pass = prompt("Password:");
                        if(email && pass) auth.signInWithEmailAndPassword(email, pass);
                    }} className="bg-blue-600 text-white px-4 py-2 rounded font-medium w-full mb-2">Sign In</button>
                    <button onClick={() => auth.signInAnonymously()} className="bg-gray-100 text-gray-700 px-4 py-2 rounded font-medium w-full">Sign In Anonymously</button>
                </div>
            );

            const harvestAllData = async () => {
                try {
                    setStatus("Scanning all user folders in Firebase...");
                    const usersRef = db.collection('artifacts').doc('lumina-flash-6298f').collection('users');
                    const userDocs = await usersRef.get();

                    let totalFolders = 0;
                    let totalSets = 0;
                    let totalCards = 0;

                    const targetUserRef = usersRef.doc(user.uid);

                    for (const doc of userDocs.docs) {
                        const oldUserId = doc.id;
                        if (oldUserId === user.uid) continue; // Skip current active user

                        // Fetch old folders, sets, cards
                        const [fSnap, sSnap, cSnap] = await Promise.all([
                            usersRef.doc(oldUserId).collection('folders').get(),
                            usersRef.doc(oldUserId).collection('sets').get(),
                            usersRef.doc(oldUserId).collection('cards').get()
                        ]);

                        for (const f of fSnap.docs) {
                            await targetUserRef.collection('folders').doc(f.id).set(f.data(), { merge: true });
                            totalFolders++;
                        }
                        for (const s of sSnap.docs) {
                            await targetUserRef.collection('sets').doc(s.id).set(s.data(), { merge: true });
                            totalSets++;
                        }
                        for (const c of cSnap.docs) {
                            await targetUserRef.collection('cards').doc(c.id).set(c.data(), { merge: true });
                            totalCards++;
                        }
                    }

                    setStatus(`Harvest Complete! Successfully imported: ${totalFolders} folders, ${totalSets} sets, and ${totalCards} cards into your account. Please refresh!`);
                } catch (e) {
                    setStatus("Error during harvest: " + e.message);
                }
            };

            return (
                <div className="p-6 max-w-4xl mx-auto">
                    <div className="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border">
                        <h1 className="text-xl font-bold">Lumina Flash Data Harvester</h1>
                        <button onClick={() => auth.signOut()} className="text-sm text-red-500 font-medium">Sign Out</button>
                    </div>

                    <div className="bg-white p-8 rounded-xl shadow-sm border text-center">
                        <h2 className="text-lg font-bold mb-2 text-gray-800">Ready to pull your old flashcards?</h2>
                        <p className="text-sm text-gray-500 mb-6">Clicking this button will scan all of those user folders shown in your Firebase console and merge your flashcards into your current account.</p>
                        <button onClick={harvestAllData} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition">
                            Auto-Harvest All Old Data
                        </button>
                        {status && <div className="mt-6 p-4 bg-blue-50 text-blue-800 rounded-lg text-sm font-medium">{status}</div>}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
