<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Flash SRS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc;
        }
        
        /* Scrollbar hiding */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* 3D Flip Utilities */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        
        /* STRICT RICH TEXT RESETS (Fixes weird spacing and Greek characters) */
        .rich-text-content {
            white-space: pre-wrap; /* Honors intentional line breaks */
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: normal; /* Prevents splitting Greek words weirdly */
            letter-spacing: normal !important;
        }
        
        /* Force standard inline behavior to prevent contenteditable from injecting blocks */
        .rich-text-content b, .rich-text-content strong,
        .rich-text-content i, .rich-text-content em,
        .rich-text-content u {
            display: inline !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: inherit;
        }

        /* Handle paragraphs safely */
        .rich-text-content p, .rich-text-content div {
            display: block;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }
        .rich-text-content p:last-child, .rich-text-content div:last-child {
            margin-bottom: 0;
        }

        /* Editor Placeholder */
        .rich-editor:empty:before { 
            content: attr(data-placeholder); 
            color: #94a3b8; 
            pointer-events: none; 
            display: block; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 1. INITIALIZE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDqk1ojTgEnzsGKnNFphi-CbMPIww43Ewo",
            authDomain: "lumina-flash-6298f.firebaseapp.com",
            projectId: "lumina-flash-6298f",
            storageBucket: "lumina-flash-6298f.firebasestorage.app",
            messagingSenderId: "281445871040",
            appId: "1:281445871040:web:8fad281101f1833c796c25"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- IMAGE COMPRESSION HELPER ---
        // Prevents Firestore from choking on massive images
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let { width, height } = img;
                    const max = 800;
                    if(width > max || height > max) {
                        if(width > height) { height *= max/width; width = max; }
                        else { width *= max/height; height = max; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // --- AUTH SCREEN ---
        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(''); setLoading(true);
                try {
                    if (isLogin) await auth.signInWithEmailAndPassword(email, password);
                    else await auth.createUserWithEmailAndPassword(email, password);
                } catch (err) { setError(err.message); }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
                        <div className="flex flex-col items-center mb-8">
                            <div className="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-3xl shadow-lg mb-4">
                                <i className="fa-solid fa-bolt"></i>
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800">Lumina Flash</h1>
                            <p className="text-slate-500 text-sm mt-2 text-center">Sign in to sync your neuroscience and biology decks globally.</p>
                        </div>
                        {error && <div className="bg-rose-50 text-rose-600 p-3 rounded-xl text-sm mb-4 border border-rose-100">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 transition" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
                                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 transition" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white font-bold p-3 rounded-xl hover:bg-indigo-700 transition disabled:opacity-50 shadow-md">
                                {loading ? 'Processing...' : (isLogin ? 'Sign In' : 'Create Account')}
                            </button>
                        </form>
                        <div className="mt-6 text-center text-sm text-slate-500">
                            {isLogin ? "Don't have an account? " : "Already have an account? "}
                            <button onClick={() => setIsLogin(!isLogin)} className="text-indigo-600 font-bold hover:underline">
                                {isLogin ? 'Sign up' : 'Sign in'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CARD EDITOR MODAL ---
        const CardEditorModal = ({ card, setId, onClose, userId }) => {
            const frontRef = useRef(null);
            const backRef = useRef(null);
            
            const [frontContent, setFrontContent] = useState(card ? card.front : '');
            const [backContent, setBackContent] = useState(card ? card.back : '');
            const [frontImage, setFrontImage] = useState(card ? card.frontImage : null);
            const [backImage, setBackImage] = useState(card ? card.backImage : null);
            const [frontFootnote, setFrontFootnote] = useState(card?.frontFootnote || '');
            const [footnote, setFootnote] = useState(card?.footnote || '');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if(frontRef.current && !frontRef.current.innerHTML) frontRef.current.innerHTML = frontContent;
                if(backRef.current && !backRef.current.innerHTML) backRef.current.innerHTML = backContent;
            }, []);

            const exec = (cmd) => { document.execCommand(cmd, false, null); };

            const handleImage = (e, setImgObj) => {
                if (e.target.files && e.target.files[0]) {
                    compressImage(e.target.files[0], (base64) => setImgObj(base64));
                }
            };

            const saveCard = async () => {
                const finalFront = frontRef.current.innerHTML.trim();
                if (!finalFront) return alert("Front side cannot be empty.");
                
                setLoading(true);
                const cardData = {
                    setId: card ? card.setId : setId,
                    front: finalFront,
                    back: backRef.current.innerHTML.trim(),
                    frontImage, backImage, frontFootnote, footnote,
                    updatedAt: Date.now()
                };

                try {
                    if (card) {
                        await db.collection('users').doc(userId).collection('cards').doc(card.id).update(cardData);
                    } else {
                        cardData.reps = 0; cardData.interval = 1; cardData.ease = 2.5; cardData.nextReview = Date.now();
                        await db.collection('users').doc(userId).collection('cards').add(cardData);
                    }
                    onClose();
                } catch(e) { alert("Error saving."); setLoading(false); }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50">
                            <h2 className="font-bold text-slate-800">{card ? 'Edit Card' : 'New Card'}</h2>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 text-slate-500 transition"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
                            {/* FRONT OF CARD */}
                            <div className="space-y-3">
                                <div className="flex justify-between items-end">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">Front (Question)</label>
                                    <div className="flex gap-1 bg-slate-100 p-1 rounded-lg">
                                        <button onClick={()=>exec('bold')} className="w-7 h-7 rounded hover:bg-white hover:shadow-sm font-bold text-slate-600">B</button>
                                        <button onClick={()=>exec('italic')} className="w-7 h-7 rounded hover:bg-white hover:shadow-sm italic text-slate-600">I</button>
                                        <button onClick={()=>exec('underline')} className="w-7 h-7 rounded hover:bg-white hover:shadow-sm underline text-slate-600">U</button>
                                    </div>
                                </div>
                                <div 
                                    ref={frontRef} contentEditable 
                                    className="rich-editor rich-text-content w-full min-h-[100px] p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 focus:bg-white transition" 
                                    data-placeholder="Type question or concept here..."
                                ></div>
                                
                                <div className="flex items-center gap-3">
                                    <label className="flex items-center gap-2 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold text-slate-600 cursor-pointer transition">
                                        <i className="fa-solid fa-image"></i> Attach Image
                                        <input type="file" accept="image/*" className="hidden" onChange={(e)=>handleImage(e, setFrontImage)} />
                                    </label>
                                    {frontImage && (
                                        <div className="relative group">
                                            <img src={frontImage} className="h-10 rounded border border-slate-300" />
                                            <button onClick={()=>setFrontImage(null)} className="absolute -top-2 -right-2 bg-rose-500 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center shadow-sm hover:scale-110"><i className="fa-solid fa-times"></i></button>
                                        </div>
                                    )}
                                </div>
                                <input type="text" value={frontFootnote} onChange={e=>setFrontFootnote(e.target.value)} placeholder="Front Footnote (e.g., hint, source, or context)..." className="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-xl text-sm outline-none focus:border-amber-400" />
                            </div>

                            <hr className="border-slate-100" />

                            {/* BACK OF CARD */}
                            <div className="space-y-3">
                                <div className="flex justify-between items-end">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">Back (Answer)</label>
                                    <div className="flex gap-1 bg-slate-100 p-1 rounded-lg">
                                        <button onClick={()=>exec('bold')} className="w-7 h-7 rounded hover:bg-white hover:shadow-sm font-bold text-slate-600">B</button>
                                        <button onClick={()=>exec('italic')} className="w-7 h-7 rounded hover:bg-white hover:shadow-sm italic text-slate-600">I</button>
                                        <button onClick={()=>exec('underline')} className="w-7 h-7 rounded hover:bg-white hover:shadow-sm underline text-slate-600">U</button>
                                    </div>
                                </div>
                                <div 
                                    ref={backRef} contentEditable 
                                    className="rich-editor rich-text-content w-full min-h-[100px] p-4 bg-indigo-50 border border-indigo-100 rounded-xl outline-none focus:border-indigo-400 focus:bg-white transition" 
                                    data-placeholder="Type answer or explanation here..."
                                ></div>
                                
                                <div className="flex items-center gap-3">
                                    <label className="flex items-center gap-2 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold text-slate-600 cursor-pointer transition">
                                        <i className="fa-solid fa-image"></i> Attach Image
                                        <input type="file" accept="image/*" className="hidden" onChange={(e)=>handleImage(e, setBackImage)} />
                                    </label>
                                    {backImage && (
                                        <div className="relative group">
                                            <img src={backImage} className="h-10 rounded border border-slate-300" />
                                            <button onClick={()=>setBackImage(null)} className="absolute -top-2 -right-2 bg-rose-500 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center shadow-sm hover:scale-110"><i className="fa-solid fa-times"></i></button>
                                        </div>
                                    )}
                                </div>
                                <input type="text" value={footnote} onChange={e=>setFootnote(e.target.value)} placeholder="Back Footnote (e.g., elaborative link, 'Why?')..." className="w-full p-3 bg-emerald-50/50 border border-emerald-100 rounded-xl text-sm outline-none focus:border-emerald-400" />
                            </div>
                        </div>

                        <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                            <button onClick={onClose} className="px-5 py-2 font-bold text-slate-600 hover:bg-slate-200 rounded-xl transition">Cancel</button>
                            <button onClick={saveCard} disabled={loading} className="px-5 py-2 font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow transition disabled:opacity-50">
                                {loading ? 'Saving...' : 'Save Card'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3D CARD FACE (Handles Text/Image Layout) ---
        const CardFace = ({ isFront, card }) => {
            const content = isFront ? card.front : card.back;
            const image = isFront ? card.frontImage : card.backImage;
            const foot = isFront ? card.frontFootnote : card.footnote;
            
            return (
                <div className={`absolute inset-0 w-full h-full backface-hidden flex flex-col rounded-3xl shadow-xl border border-slate-200 bg-white p-6 md:p-8 ${!isFront ? '[transform:rotateY(180deg)]' : ''}`}>
                    
                    {/* Header Badge */}
                    <div className="flex justify-between items-start shrink-0 mb-2">
                        <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 bg-slate-100 px-3 py-1 rounded-full">
                            {isFront ? 'Question' : 'Answer'}
                        </span>
                    </div>

                    {/* Content Area - Safe Scrolling without Top Clipping */}
                    <div className="flex-1 w-full overflow-y-auto custom-scrollbar relative">
                        <div className="grid place-items-center min-h-full py-4">
                            <div className="flex flex-col items-center gap-6 w-full">
                                {content && (
                                    <div className="rich-text-content w-full text-center text-xl md:text-2xl font-medium text-slate-800"
                                         dangerouslySetInnerHTML={{ __html: content }}></div>
                                )}
                                {image && (
                                    <img src={image} className="max-h-48 md:max-h-64 w-auto object-contain rounded-xl shadow-sm border border-slate-200" alt="Attachment" />
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="shrink-0 mt-4 flex flex-col items-center text-center">
                        {foot && (
                            <div className="text-sm font-medium text-slate-500 mb-3 border-t border-slate-100 pt-3 w-full">
                                {foot}
                            </div>
                        )}
                        <div className="text-[10px] font-bold tracking-widest uppercase text-slate-300">Tap to flip</div>
                    </div>
                </div>
            );
        };

        // --- BROWSE MODE (No Grading, Just Viewing) ---
        const BrowseView = ({ cards, setName, onBack }) => {
            const [idx, setIdx] = useState(0);
            const [showBack, setShowBack] = useState(false);
            
            if(cards.length === 0) return (
                <div className="flex-1 flex flex-col items-center justify-center"><p className="text-slate-500">No cards to browse.</p><button onClick={onBack} className="mt-4 text-indigo-600 font-bold">Go Back</button></div>
            );
            
            const next = () => { setIdx((i) => (i + 1) % cards.length); setShowBack(false); };
            const prev = () => { setIdx((i) => (i - 1 + cards.length) % cards.length); setShowBack(false); };

            return (
                <div className="flex-1 flex flex-col p-4">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-100">
                        <button onClick={onBack} className="text-slate-500 hover:text-slate-800 font-bold flex items-center gap-2"><i className="fa-solid fa-arrow-left"></i> Back</button>
                        <h2 className="font-bold text-slate-800 hidden sm:block">Browsing: {setName}</h2>
                        <div className="text-sm font-bold bg-slate-100 text-slate-500 px-3 py-1 rounded-full">{idx + 1} / {cards.length}</div>
                    </div>
                    
                    <div className="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full">
                        <div className="relative w-full aspect-[4/3] md:aspect-[16/10] max-h-[60vh] perspective-1000 cursor-pointer" onClick={() => setShowBack(!showBack)}>
                            <div className={`w-full h-full relative transition-transform duration-500 transform-style-3d ${showBack ? '[transform:rotateY(180deg)]' : ''}`}>
                                <CardFace isFront={true} card={cards[idx]} />
                                <CardFace isFront={false} card={cards[idx]} />
                            </div>
                        </div>
                        
                        <div className="flex gap-4 mt-8 w-full max-w-xs">
                            <button onClick={prev} className="flex-1 bg-white border border-slate-200 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-50 shadow-sm"><i className="fa-solid fa-chevron-left"></i> Prev</button>
                            <button onClick={next} className="flex-1 bg-white border border-slate-200 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-50 shadow-sm">Next <i className="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- STUDY MODE (SM-2 Algorithm) ---
        const StudyView = ({ cards, setName, onBack, userId, db }) => {
            const dueCards = cards.filter(c => c.nextReview <= Date.now());
            const [showBack, setShowBack] = useState(false);
            
            if(dueCards.length === 0) return (
                <div className="flex-1 flex flex-col items-center justify-center text-center p-4">
                    <div className="text-6xl mb-4">🎉</div>
                    <h2 className="text-2xl font-bold text-slate-800 mb-2">You're all caught up!</h2>
                    <p className="text-slate-500 mb-6">Excellent work. The algorithm will bring cards back when you need them.</p>
                    <button onClick={onBack} className="bg-indigo-600 text-white font-bold px-6 py-3 rounded-xl shadow-md hover:bg-indigo-700 transition">Return to Dashboard</button>
                </div>
            );

            const card = dueCards[0];

            const handleGrade = async (grade) => {
                let { reps, interval, ease } = card;
                if (grade === 0) { // Hard
                    reps = 0; interval = 1; ease = Math.max(1.3, ease - 0.2);
                } else if (grade === 1) { // Good
                    if (reps === 0) interval = 1; else if (reps === 1) interval = 6; else interval = Math.round(interval * ease);
                    reps += 1;
                } else if (grade === 2) { // Easy
                    if (reps === 0) interval = 4; else if (reps === 1) interval = 10; else interval = Math.round(interval * ease * 1.3);
                    ease += 0.15; reps += 1;
                }
                const jitter = Math.random() * 0.1 * interval; 
                const finalInterval = interval + jitter;
                const nextReview = Date.now() + (finalInterval * 24 * 60 * 60 * 1000);

                setShowBack(false);
                await db.collection('users').doc(userId).collection('cards').doc(card.id).update({ reps, interval, ease, nextReview });
            };

            return (
                <div className="flex-1 flex flex-col p-4">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-100">
                        <button onClick={onBack} className="text-slate-500 hover:text-slate-800 font-bold flex items-center gap-2"><i className="fa-solid fa-arrow-left"></i> Back</button>
                        <h2 className="font-bold text-slate-800 hidden sm:block">Studying: {setName}</h2>
                        <div className="text-sm font-bold bg-orange-100 text-orange-600 px-3 py-1 rounded-full">{dueCards.length} Due</div>
                    </div>
                    
                    <div className="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full">
                        <div className="relative w-full aspect-[4/3] md:aspect-[16/10] max-h-[60vh] perspective-1000 cursor-pointer" onClick={() => !showBack && setShowBack(true)}>
                            <div className={`w-full h-full relative transition-transform duration-500 transform-style-3d ${showBack ? '[transform:rotateY(180deg)]' : ''}`}>
                                <CardFace isFront={true} card={card} />
                                <CardFace isFront={false} card={card} />
                            </div>
                        </div>
                        
                        <div className={`flex gap-3 mt-8 w-full max-w-md transition-opacity duration-300 ${showBack ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                            <button onClick={()=>handleGrade(0)} className="flex-1 bg-rose-100 hover:bg-rose-200 text-rose-700 py-3 rounded-xl font-bold shadow-sm transition">Hard <span className="block text-xs font-normal opacity-70">&lt;1d</span></button>
                            <button onClick={()=>handleGrade(1)} className="flex-1 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 py-3 rounded-xl font-bold shadow-sm transition">Good <span className="block text-xs font-normal opacity-70">Normal</span></button>
                            <button onClick={()=>handleGrade(2)} className="flex-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 py-3 rounded-xl font-bold shadow-sm transition">Easy <span className="block text-xs font-normal opacity-70">Delay</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [currentFolderId, setCurrentFolderId] = useState(null);
            const [studySetId, setStudySetId] = useState(null);
            const [browseSetId, setBrowseSetId] = useState(null);
            const [showCalendar, setShowCalendar] = useState(false);
            
            // Editor State
            const [editingCard, setEditingCard] = useState(null);
            const [newCardSetId, setNewCardSetId] = useState(null);

            // Data State
            const [folders, setFolders] = useState([]);
            const [sets, setSets] = useState([]);
            const [cards, setCards] = useState([]);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    if (u && !u.isAnonymous) setUser(u);
                    else setUser(null);
                    setLoading(false);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                const userRef = db.collection('users').doc(user.uid);
                const unsubF = userRef.collection('folders').onSnapshot(s => setFolders(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubS = userRef.collection('sets').onSnapshot(s => setSets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubC = userRef.collection('cards').onSnapshot(s => setCards(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubF(); unsubS(); unsubC(); };
            }, [user]);

            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center"><i className="fa-solid fa-spinner fa-spin text-4xl text-indigo-500"></i></div>;
            if (!user) return <AuthScreen />;

            // --- DELETION LOGIC (Recursive) ---
            const deleteFolder = async (id) => {
                if(!confirm("Permanently delete this folder and EVERYTHING inside it?")) return;
                const userRef = db.collection('users').doc(user.uid);
                await userRef.collection('folders').doc(id).delete();
                const childSets = sets.filter(s => s.folderId === id);
                for (const set of childSets) {
                    await userRef.collection('sets').doc(set.id).delete();
                    const childCards = cards.filter(c => c.setId === set.id);
                    for (const card of childCards) await userRef.collection('cards').doc(card.id).delete();
                }
            };

            const deleteSet = async (id) => {
                if(!confirm("Permanently delete this set and all its cards?")) return;
                const userRef = db.collection('users').doc(user.uid);
                await userRef.collection('sets').doc(id).delete();
                const childCards = cards.filter(c => c.setId === id);
                for (const card of childCards) await userRef.collection('cards').doc(card.id).delete();
            };

            // --- CREATION LOGIC ---
            const createFolder = async () => {
                const name = prompt("Folder Name:");
                if(!name) return;
                const icon = prompt("Enter an emoji or short text for the icon (e.g., 🧠, 🧬, or leave blank):") || "📁";
                await db.collection('users').doc(user.uid).collection('folders').add({ name, icon, parentId: currentFolderId, createdAt: Date.now() });
            };

            const createSet = async () => {
                const name = prompt("Study Set Name:");
                if(!name) return;
                const icon = prompt("Enter an emoji for the icon (or leave blank):") || "📄";
                await db.collection('users').doc(user.uid).collection('sets').add({ name, icon, folderId: currentFolderId, createdAt: Date.now() });
            };

            // --- CALENDAR LOGIC ---
            const getCalendarStats = () => {
                let today = 0, tomorrow = 0, future = 0;
                const now = new Date();
                const todayStr = now.toDateString();
                const tom = new Date(now); tom.setDate(tom.getDate() + 1);
                const tomStr = tom.toDateString();
                
                cards.forEach(c => {
                    const rDate = new Date(c.nextReview);
                    if (c.nextReview <= Date.now() || rDate.toDateString() === todayStr) today++;
                    else if (rDate.toDateString() === tomStr) tomorrow++;
                    else future++;
                });
                return { today, tomorrow, future };
            };

            // Views routing
            if (studySetId) return <StudyView cards={cards.filter(c=>c.setId===studySetId)} setName={sets.find(s=>s.id===studySetId)?.name} onBack={()=>setStudySetId(null)} userId={user.uid} db={db} />;
            if (browseSetId) return <BrowseView cards={cards.filter(c=>c.setId===browseSetId)} setName={sets.find(s=>s.id===browseSetId)?.name} onBack={()=>setBrowseSetId(null)} />;

            const visFolders = folders.filter(f => f.parentId === currentFolderId);
            const visSets = sets.filter(s => s.folderId === currentFolderId);
            const stats = getCalendarStats();

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Top Nav */}
                    <header className="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shrink-0 z-20">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentFolderId(null)}>
                            <div className="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center shadow-sm"><i className="fa-solid fa-bolt"></i></div>
                            <span className="text-xl font-bold text-slate-800 tracking-tight hidden sm:block">Lumina Flash</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={()=>setShowCalendar(!showCalendar)} className="text-slate-500 hover:text-indigo-600 text-xl relative">
                                <i className="fa-solid fa-calendar-days"></i>
                                {stats.today > 0 && <span className="absolute -top-1 -right-1.5 bg-rose-500 text-white text-[9px] font-bold px-1 rounded-full">{stats.today}</span>}
                            </button>
                            <div className="flex items-center text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100">
                                <i className="fa-solid fa-cloud-check mr-1"></i> <span className="hidden sm:inline">Synced</span>
                            </div>
                            <button onClick={()=>{if(confirm("Log out?")) auth.signOut();}} className="text-sm font-bold text-slate-400 hover:text-rose-500">Out</button>
                        </div>
                    </header>

                    {/* Calendar Sidebar Drawer */}
                    {showCalendar && (
                        <div className="absolute right-0 top-14 bottom-0 w-72 bg-white border-l border-slate-200 shadow-2xl z-10 p-6 flex flex-col animate-[fadeIn_0.2s_ease-out]">
                            <h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2"><i className="fa-solid fa-chart-pie text-indigo-500"></i> Review Schedule</h3>
                            <div className="space-y-4">
                                <div className="bg-rose-50 p-4 rounded-2xl border border-rose-100 flex justify-between items-center">
                                    <span className="font-bold text-rose-800">Due Today</span>
                                    <span className="bg-rose-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-sm">{stats.today}</span>
                                </div>
                                <div className="bg-amber-50 p-4 rounded-2xl border border-amber-100 flex justify-between items-center">
                                    <span className="font-bold text-amber-800">Tomorrow</span>
                                    <span className="bg-amber-400 text-white text-xs font-bold px-2 py-1 rounded-full shadow-sm">{stats.tomorrow}</span>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex justify-between items-center">
                                    <span className="font-bold text-slate-600">Future</span>
                                    <span className="bg-slate-300 text-slate-600 text-xs font-bold px-2 py-1 rounded-full shadow-sm">{stats.future}</span>
                                </div>
                            </div>
                            <div className="mt-auto pt-4 border-t border-slate-100 text-xs text-slate-400 leading-relaxed text-center">
                                Lumina uses a custom SM-2 algorithm to predict when you are likely to forget a concept.
                            </div>
                        </div>
                    )}

                    {/* Main Dashboard */}
                    <main className="flex-1 p-6 max-w-6xl mx-auto w-full">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                            <div className="flex items-center text-sm font-bold text-slate-500 gap-2">
                                <button onClick={() => setCurrentFolderId(null)} className="hover:text-indigo-600 flex items-center gap-1"><i className="fa-solid fa-home"></i> Home</button>
                                {/* Breadcrumbs omitted for brevity in full monolithic view, but user can always click Home */}
                            </div>
                            <div className="flex gap-2 w-full sm:w-auto">
                                <button onClick={createFolder} className="flex-1 sm:flex-none bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold hover:border-indigo-300 hover:text-indigo-600 shadow-sm transition"><i className="fa-solid fa-folder-plus mr-1"></i> New Folder</button>
                                <button onClick={createSet} className="flex-1 sm:flex-none bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 shadow-sm transition"><i className="fa-solid fa-layer-group mr-1"></i> New Set</button>
                            </div>
                        </div>

                        {(visFolders.length === 0 && visSets.length === 0) && (
                            <div className="py-24 text-center border-2 border-dashed border-slate-200 rounded-3xl">
                                <div className="text-4xl mb-4 opacity-50">📂</div>
                                <h3 className="text-lg font-bold text-slate-700">Workspace Empty</h3>
                                <p className="text-sm text-slate-500 mt-1">Create a folder or study set above.</p>
                            </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            {visFolders.map(f => (
                                <div key={f.id} onClick={()=>setCurrentFolderId(f.id)} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md hover:border-indigo-100 transition cursor-pointer group flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-500 text-lg">{f.icon || '📁'}</div>
                                        <h3 className="font-bold text-slate-800">{f.name}</h3>
                                    </div>
                                    <button onClick={(e)=>{e.stopPropagation(); deleteFolder(f.id);}} className="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition p-2"><i className="fa-solid fa-trash"></i></button>
                                </div>
                            ))}

                            {visSets.map(s => {
                                const sCards = cards.filter(c=>c.setId===s.id);
                                const due = sCards.filter(c=>c.nextReview<=Date.now()).length;
                                return (
                                    <div key={s.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md hover:border-indigo-100 transition group flex flex-col min-h-[160px]">
                                        <div className="flex justify-between items-start mb-4">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-500 text-lg">{s.icon || '📄'}</div>
                                                <h3 className="font-bold text-slate-800 line-clamp-2">{s.name}</h3>
                                            </div>
                                            <div className="relative group/menu">
                                                <button className="text-slate-400 hover:text-slate-600 p-1"><i className="fa-solid fa-ellipsis-vertical"></i></button>
                                                <div className="absolute right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl w-32 overflow-hidden opacity-0 invisible group-hover/menu:opacity-100 group-hover/menu:visible transition z-10">
                                                    <button onClick={()=>setBrowseSetId(s.id)} className="w-full text-left px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50 flex items-center gap-2"><i className="fa-solid fa-book-open w-4"></i> Browse</button>
                                                    <button onClick={()=>deleteSet(s.id)} className="w-full text-left px-4 py-2 text-sm font-bold text-rose-600 hover:bg-rose-50 flex items-center gap-2 border-t border-slate-100"><i className="fa-solid fa-trash w-4"></i> Delete</button>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <button onClick={()=>setNewCardSetId(s.id)} className="mb-4 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg w-max transition flex items-center gap-1"><i className="fa-solid fa-plus"></i> Add Card</button>

                                        <div className="mt-auto pt-4 border-t border-slate-50 flex justify-between items-center">
                                            <span className="text-xs font-bold text-slate-400">{sCards.length} Cards</span>
                                            {due > 0 ? (
                                                <button onClick={()=>setStudySetId(s.id)} className="bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm hover:bg-rose-600 hover:scale-105 transition flex items-center gap-1"><i className="fa-solid fa-fire"></i> {due} Due</button>
                                            ) : (
                                                <span className="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full"><i className="fa-solid fa-check"></i> Done</span>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {newCardSetId && <CardEditorModal setId={newCardSetId} onClose={()=>setNewCardSetId(null)} userId={user.uid} db={db} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
