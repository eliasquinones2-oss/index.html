<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Flash SRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const firebaseConfig = {
            apiKey: "AIzaSyDqk1ojTgEnzsGKnNFphi-CbMPIww43Ewo",
            authDomain: "lumina-flash-6298f.firebaseapp.com",
            projectId: "lumina-flash-6298f",
            storageBucket: "lumina-flash-6298f.firebasestorage.app",
            messagingSenderId: "281445871040",
            appId: "1:281445871040:web:8fad281101f1833c796c25"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [sets, setSets] = useState([]);
            const [showImportModal, setShowImportModal] = useState(false);
            const [importText, setImportText] = useState("");

            useEffect(() => {
                return auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                    if (u) loadData(u.uid);
                });
            }, []);

            const loadData = async (uid) => {
                const userRef = db.collection('artifacts').doc('lumina-flash-6298f').collection('users').doc(uid);
                const sSnap = await userRef.collection('study_sets_v2').get();
                setSets(sSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const handleImport = async () => {
                try {
                    const data = JSON.parse(importText);
                    const userRef = db.collection('artifacts').doc('lumina-flash-6298f').collection('users').doc(user.uid);
                    
                    let count = 0;
                    for (const [key, val] of Object.entries(data)) {
                        const parts = key.split('/');
                        const folderName = parts.length > 1 ? parts[0] : "General";
                        const setName = parts.length > 1 ? parts[1] : key;

                        const docId = key.replace(/[^a-zA-Z0-9-_]/g, '_');
                        // Write each set as its own distinct document, safely under the 1MB limit
                        await userRef.collection('study_sets_v2').doc(docId).set({
                            name: setName,
                            folderName: folderName,
                            ...val,
                            updatedAt: Date.now()
                        }, { merge: true });
                        count++;
                    }

                    alert(`Successfully imported ${count} sets cleanly!`);
                    setShowImportModal(false);
                    loadData(user.uid);
                } catch (e) {
                    alert("Import Error: " + e.message);
                }
            };

            if (loading) return <div className="p-10 text-center font-bold">Loading...</div>;

            if (!user) return (
                <div className="p-10 text-center max-w-md mx-auto mt-20 bg-white rounded-2xl shadow-xl border">
                    <h1 className="text-2xl font-black mb-2 text-blue-600">Lumina Flash (Cache-Bust v2)</h1>
                    <button onClick={() => auth.signInAnonymously()} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3">Sign In Anonymously</button>
                    <button onClick={() => {
                        const email = prompt("Email:");
                        const pass = prompt("Password:");
                        if(email && pass) auth.signInWithEmailAndPassword(email, pass);
                    }} className="w-full bg-slate-100 text-slate-700 py-3 rounded-xl font-bold">Sign In with Email</button>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-40">
                        <h1 className="text-xl font-extrabold text-slate-800">Lumina Flash (Cache-Bust v2)</h1>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setShowImportModal(true)} className="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg text-sm font-bold border border-emerald-200 hover:bg-emerald-100">📥 Import Your Backup</button>
                            <button onClick={() => auth.signOut()} className="text-sm text-red-500 font-semibold px-3 py-1.5 rounded-lg">Sign Out</button>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto p-6">
                        <h2 className="text-lg font-bold text-slate-700 mb-4">Your Study Sets</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {sets.map(s => (
                                <div key={s.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="font-bold text-base mb-1">{s.name}</h3>
                                    <p className="text-xs text-slate-400">Folder: {s.folderName || "General"}</p>
                                </div>
                            ))}
                            {sets.length === 0 && <p className="text-slate-400 text-sm">No sets found yet. Click "Import Your Backup" above!</p>}
                        </div>
                    </main>

                    {showImportModal && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-lg p-6 rounded-2xl shadow-2xl">
                                <h3 className="text-lg font-bold mb-2">Import Your Flashcard JSON</h3>
                                <p className="text-xs text-slate-500 mb-4">Paste your exported backup JSON below.</p>
                                <textarea value={importText} onChange={e => setImportText(e.target.value)} placeholder='Paste JSON here...' className="w-full h-48 p-3 border rounded-xl text-xs font-mono mb-4 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowImportModal(false)} className="px-4 py-2 rounded-xl text-sm font-bold text-slate-500">Cancel</button>
                                    <button onClick={handleImport} className="px-4 py-2 rounded-xl text-sm font-bold bg-blue-600 text-white">Import Now</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
