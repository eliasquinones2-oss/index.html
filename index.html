<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Flash SRS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat (Stable for single HTML files) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 1. Initialize Firebase (Your exact keys)
        const firebaseConfig = {
            apiKey: "AIzaSyDqk1ojTgEnzsGKnNFphi-CbMPIww43Ewo",
            authDomain: "lumina-flash-6298f.firebaseapp.com",
            projectId: "lumina-flash-6298f",
            storageBucket: "lumina-flash-6298f.firebasestorage.app",
            messagingSenderId: "281445871040",
            appId: "1:281445871040:web:8fad281101f1833c796c25"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- ICONS (SVG) ---
        const IconLogo = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
        const IconCloud = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
        const IconFolder = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-1.22-1.8A2 2 0 0 0 7.53 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>;
        const IconSet = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>;
        const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconPlay = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const IconDots = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>;
        const IconArrowLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;

        // --- AUTH SCREEN ---
        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
                        <div className="flex flex-col items-center mb-8">
                            <div className="text-blue-600 mb-2"><IconLogo /></div>
                            <h1 className="text-2xl font-bold text-gray-800">Lumina Flash</h1>
                            <p className="text-gray-500 text-sm mt-2 text-center">Sign in to sync your flashcards across all your devices.</p>
                        </div>

                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4">{error}</div>}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg outline-none focus:border-blue-500" placeholder="you@example.com" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg outline-none focus:border-blue-500" placeholder="••••••••" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-medium p-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">
                                {loading ? 'Please wait...' : (isLogin ? 'Sign In' : 'Create Account')}
                            </button>
                        </form>

                        <div className="mt-6 text-center text-sm text-gray-500">
                            {isLogin ? "Don't have an account? " : "Already have an account? "}
                            <button onClick={() => setIsLogin(!isLogin)} className="text-blue-600 font-medium hover:underline">
                                {isLogin ? 'Sign up' : 'Sign in'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('study');
            const [currentFolderId, setCurrentFolderId] = useState(null);
            const [studySetId, setStudySetId] = useState(null);

            // Data State
            const [folders, setFolders] = useState([]);
            const [sets, setSets] = useState([]);
            const [cards, setCards] = useState([]);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    // Ignore anonymous users now that we have real auth
                    if (u && !u.isAnonymous) {
                        setUser(u);
                    } else {
                        setUser(null);
                    }
                    setAuthLoading(false);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                const userRef = db.collection('users').doc(user.uid);
                
                const unsubF = userRef.collection('folders').onSnapshot(snap => {
                    setFolders(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsubS = userRef.collection('sets').onSnapshot(snap => {
                    setSets(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsubC = userRef.collection('cards').onSnapshot(snap => {
                    setCards(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });

                return () => { unsubF(); unsubS(); unsubC(); };
            }, [user]);

            if (authLoading) return <div className="min-h-screen flex items-center justify-center">Loading...</div>;
            if (!user) return <AuthScreen />;

            // Helper to get breadcrumbs
            const getBreadcrumbs = () => {
                let crumbs = [];
                let curr = folders.find(f => f.id === currentFolderId);
                while (curr) {
                    crumbs.unshift(curr);
                    curr = folders.find(f => f.id === curr.parentId);
                }
                return crumbs;
            };

            const handleCreateFolder = async () => {
                const name = prompt("Folder Name:");
                if (!name) return;
                await db.collection('users').doc(user.uid).collection('folders').add({
                    name, parentId: currentFolderId, createdAt: Date.now()
                });
            };

            const handleCreateSet = async () => {
                const name = prompt("Set Name:");
                if (!name) return;
                await db.collection('users').doc(user.uid).collection('sets').add({
                    name, folderId: currentFolderId, createdAt: Date.now()
                });
            };

            const handleCreateCard = async (setId) => {
                const front = prompt("Card Front:");
                if (!front) return;
                const back = prompt("Card Back:");
                if (!back) return;
                await db.collection('users').doc(user.uid).collection('cards').add({
                    setId, front, back, reps: 0, interval: 1, ease: 2.5, nextReview: Date.now()
                });
            };

            const deleteItem = async (col, id) => {
                if(confirm("Are you sure you want to delete this?")) {
                    await db.collection('users').doc(user.uid).collection(col).doc(id).delete();
                }
            };

            const handleSignOut = () => {
                if(confirm("Sign out of Lumina Flash?")) auth.signOut();
            }

            // --- STUDY COMPONENT ---
            if (studySetId) {
                const setCards = cards.filter(c => c.setId === studySetId);
                const dueCards = setCards.filter(c => c.nextReview <= Date.now());
                const setName = sets.find(s => s.id === studySetId)?.name || "Study Set";
                
                return (
                    <div className="min-h-screen flex flex-col bg-slate-100">
                        <div className="p-4 flex items-center justify-between bg-white shadow-sm">
                            <button onClick={() => setStudySetId(null)} className="flex items-center text-gray-600 hover:text-gray-900">
                                <IconArrowLeft /> <span className="ml-2 font-medium">Back</span>
                            </button>
                            <h2 className="font-bold text-gray-800">{setName}</h2>
                            <div className="text-sm text-gray-500">{dueCards.length} Due</div>
                        </div>

                        <div className="flex-1 p-4 flex flex-col items-center justify-center max-w-2xl mx-auto w-full">
                            {dueCards.length === 0 ? (
                                <div className="text-center">
                                    <div className="text-4xl mb-4">🎉</div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">You're all caught up!</h2>
                                    <p className="text-gray-500 mb-6">No more cards due right now.</p>
                                    <button onClick={() => setStudySetId(null)} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700">Return to Dashboard</button>
                                </div>
                            ) : (
                                <StudyCard card={dueCards[0]} userId={user.uid} db={db} />
                            )}
                        </div>
                    </div>
                );
            }

            // Filter for current view
            const visibleFolders = folders.filter(f => f.parentId === currentFolderId);
            const visibleSets = sets.filter(s => s.folderId === currentFolderId);
            const isEmpty = visibleFolders.length === 0 && visibleSets.length === 0;

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 px-4 py-3 sm:px-6 flex justify-between items-center sticky top-0 z-10">
                        <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setCurrentFolderId(null)}>
                            <div className="text-blue-600"><IconLogo /></div>
                            <span className="text-xl font-bold text-blue-800 hidden sm:block">Lumina Flash</span>
                        </div>
                        
                        <div className="flex items-center space-x-2 sm:space-x-4">
                            <div className="flex items-center text-xs font-medium text-emerald-600 bg-emerald-50 px-2 sm:px-3 py-1 rounded-full border border-emerald-100">
                                <IconCloud /> <span className="ml-1 hidden sm:inline">Connected</span>
                            </div>
                            <div className="bg-gray-100 p-1 rounded-lg flex space-x-1">
                                <button onClick={() => setActiveTab('study')} className={`px-3 py-1.5 text-sm font-medium rounded-md transition ${activeTab === 'study' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}>Study Sets</button>
                                <button onClick={() => setActiveTab('import')} className={`px-3 py-1.5 text-sm font-medium rounded-md transition ${activeTab === 'import' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}>Import / Export</button>
                            </div>
                            <button onClick={handleSignOut} className="text-sm text-gray-500 hover:text-red-500 font-medium px-2">Log Out</button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 p-4 sm:p-8 max-w-6xl mx-auto w-full">
                        {activeTab === 'import' ? (
                            <ImportExportUI folders={folders} sets={sets} cards={cards} userId={user.uid} db={db} />
                        ) : (
                            <>
                                {/* Breadcrumbs & Actions */}
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
                                    <div className="flex items-center text-sm font-medium text-gray-600 space-x-2 overflow-x-auto hide-scrollbar w-full sm:w-auto pb-1 sm:pb-0">
                                        <button onClick={() => setCurrentFolderId(null)} className="flex items-center hover:text-blue-600 whitespace-nowrap"><IconHome /> <span className="ml-1">Home</span></button>
                                        {getBreadcrumbs().map(crumb => (
                                            <React.Fragment key={crumb.id}>
                                                <span className="text-gray-300">/</span>
                                                <button onClick={() => setCurrentFolderId(crumb.id)} className="hover:text-blue-600 whitespace-nowrap">{crumb.name}</button>
                                            </React.Fragment>
                                        ))}
                                    </div>
                                    <div className="flex space-x-2 w-full sm:w-auto">
                                        <button onClick={handleCreateFolder} className="flex-1 sm:flex-none flex items-center justify-center bg-white border border-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-50 shadow-sm"><IconFolder className="w-4 h-4 mr-1 text-gray-400"/> New Folder</button>
                                        <button onClick={handleCreateSet} className="flex-1 sm:flex-none flex items-center justify-center bg-white border border-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-50 shadow-sm"><IconSet className="w-4 h-4 mr-1 text-gray-400"/> New Set</button>
                                    </div>
                                </div>

                                {/* Empty State */}
                                {isEmpty && (
                                    <div className="flex flex-col items-center justify-center py-20 text-center bg-white rounded-2xl border border-dashed border-gray-300">
                                        <IconFolder className="w-16 h-16 text-gray-300 mb-4" />
                                        <h3 className="text-lg font-bold text-gray-700 mb-1">It's empty here!</h3>
                                        <p className="text-gray-500 text-sm">Create a New Folder or Set to get started.</p>
                                    </div>
                                )}

                                {/* Grid */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {/* Folders */}
                                    {visibleFolders.map(folder => (
                                        <div key={folder.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer flex justify-between items-center group" onClick={() => setCurrentFolderId(folder.id)}>
                                            <div className="flex items-center space-x-3">
                                                <div className="bg-blue-50 p-2 rounded-lg text-blue-500"><IconFolder className="w-5 h-5"/></div>
                                                <h3 className="font-semibold text-gray-800">{folder.name}</h3>
                                            </div>
                                            <button onClick={(e) => { e.stopPropagation(); deleteItem('folders', folder.id); }} className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition"><IconDots /></button>
                                        </div>
                                    ))}

                                    {/* Sets */}
                                    {visibleSets.map(set => {
                                        const setCards = cards.filter(c => c.setId === set.id);
                                        const dueCount = setCards.filter(c => c.nextReview <= Date.now()).length;
                                        return (
                                            <div key={set.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition flex flex-col relative group cursor-pointer" onClick={() => setStudySetId(set.id)}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className="flex items-center space-x-3">
                                                        <div className="bg-indigo-50 p-2 rounded-lg text-indigo-500"><IconSet className="w-5 h-5"/></div>
                                                        <h3 className="font-semibold text-gray-800 line-clamp-2 pr-6">{set.name}</h3>
                                                    </div>
                                                </div>
                                                
                                                {/* Action Buttons Overlay */}
                                                <div className="absolute top-4 right-4 flex flex-col space-y-2 opacity-0 group-hover:opacity-100 transition items-end">
                                                    <button onClick={(e) => { e.stopPropagation(); deleteItem('sets', set.id); }} className="p-1 text-gray-400 hover:text-red-500 bg-white rounded-full shadow-sm border border-gray-100"><IconDots /></button>
                                                    <button onClick={(e) => { e.stopPropagation(); handleCreateCard(set.id); }} className="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-medium shadow-sm border border-indigo-100">+ Add Card</button>
                                                </div>

                                                <div className="mt-auto pt-3 border-t border-gray-50 flex justify-between items-center">
                                                    <div className="text-xs font-medium text-gray-500">{setCards.length} Cards</div>
                                                    <div className={`text-xs font-bold px-2 py-1 rounded-full ${dueCount > 0 ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}`}>
                                                        {dueCount} Due
                                                    </div>
                                                </div>
                                                {dueCount > 0 && (
                                                    <div className="absolute bottom-4 right-4 bg-emerald-500 text-white p-2 rounded-full shadow-md hover:bg-emerald-600 transition transform hover:scale-105">
                                                        <IconPlay />
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </main>
                </div>
            );
        };

        // --- FLASHCARD COMPONENT ---
        const StudyCard = ({ card, userId, db }) => {
            const [showBack, setShowBack] = useState(false);

            useEffect(() => { setShowBack(false); }, [card]);

            const handleGrade = async (grade) => {
                let { reps, interval, ease } = card;
                
                if (grade === 0) { // Hard
                    reps = 0;
                    interval = 1;
                    ease = Math.max(1.3, ease - 0.2);
                } else if (grade === 1) { // Good
                    if (reps === 0) interval = 1;
                    else if (reps === 1) interval = 6;
                    else interval = Math.round(interval * ease);
                    reps += 1;
                } else if (grade === 2) { // Easy
                    if (reps === 0) interval = 4;
                    else if (reps === 1) interval = 10;
                    else interval = Math.round(interval * ease * 1.3);
                    ease += 0.15;
                    reps += 1;
                }

                // Add Jitter (up to 10% randomization to prevent clumping)
                const jitter = Math.random() * 0.1 * interval; 
                const finalInterval = interval + jitter;
                const nextReview = Date.now() + (finalInterval * 24 * 60 * 60 * 1000);

                await db.collection('users').doc(userId).collection('cards').doc(card.id).update({
                    reps, interval, ease, nextReview
                });
            };

            return (
                <div className="w-full flex flex-col items-center">
                    <div 
                        onClick={() => setShowBack(true)}
                        className={`w-full min-h-[300px] bg-white rounded-2xl shadow-lg border border-gray-100 p-8 flex items-center justify-center text-center cursor-pointer transition-all duration-300 transform ${showBack ? 'bg-blue-50/30' : 'hover:scale-[1.02]'}`}
                    >
                        <div className="text-2xl font-medium text-gray-800 break-words w-full">
                            {showBack ? card.back : card.front}
                        </div>
                    </div>

                    {!showBack ? (
                        <div className="mt-8 text-gray-500 font-medium">Tap card to flip</div>
                    ) : (
                        <div className="mt-8 flex justify-center space-x-3 w-full max-w-sm">
                            <button onClick={() => handleGrade(0)} className="flex-1 py-3 bg-red-100 text-red-700 font-bold rounded-xl hover:bg-red-200 transition">Hard <span className="block text-xs font-normal opacity-70">&lt; 1d</span></button>
                            <button onClick={() => handleGrade(1)} className="flex-1 py-3 bg-blue-100 text-blue-700 font-bold rounded-xl hover:bg-blue-200 transition">Good <span className="block text-xs font-normal opacity-70">Standard</span></button>
                            <button onClick={() => handleGrade(2)} className="flex-1 py-3 bg-green-100 text-green-700 font-bold rounded-xl hover:bg-green-200 transition">Easy <span className="block text-xs font-normal opacity-70">Delay</span></button>
                        </div>
                    )}
                </div>
            );
        };

        // --- IMPORT/EXPORT COMPONENT ---
        const ImportExportUI = ({ folders, sets, cards, userId, db }) => {
            const [importText, setImportText] = useState("");
            const [status, setStatus] = useState("");

            const handleExport = () => {
                const data = JSON.stringify({ folders, sets, cards });
                navigator.clipboard.writeText(data).then(() => setStatus("Copied to clipboard!"));
                setTimeout(() => setStatus(""), 3000);
            };

            const handleImport = async () => {
                try {
                    const data = JSON.parse(importText);
                    if (!data.folders || !data.sets || !data.cards) throw new Error("Invalid format");
                    
                    if(!confirm("Warning: Importing will combine these cards with your current ones. Continue?")) return;

                    setStatus("Importing... Please wait.");
                    const userRef = db.collection('users').doc(userId);
                    
                    // Note: In a real prod app, use a batch write. For simplicity here:
                    for (const f of data.folders) {
                        const { id, ...rest } = f;
                        await userRef.collection('folders').doc(id).set(rest);
                    }
                    for (const s of data.sets) {
                        const { id, ...rest } = s;
                        await userRef.collection('sets').doc(id).set(rest);
                    }
                    for (const c of data.cards) {
                        const { id, ...rest } = c;
                        await userRef.collection('cards').doc(id).set(rest);
                    }
                    
                    setStatus("Import successful!");
                    setImportText("");
                } catch (e) {
                    setStatus("Error: Invalid JSON data.");
                }
            };

            return (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 max-w-3xl mx-auto">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">Backup & Restore</h2>
                    
                    <div className="mb-8 p-4 bg-blue-50 rounded-xl border border-blue-100">
                        <h3 className="font-bold text-blue-800 mb-2">Export Data</h3>
                        <p className="text-sm text-blue-600 mb-4">Save all your folders, sets, and cards as text. Paste this into an Apple Note or document to keep it safe.</p>
                        <button onClick={handleExport} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">Copy JSON to Clipboard</button>
                    </div>

                    <div>
                        <h3 className="font-bold text-gray-800 mb-2">Import Data</h3>
                        <p className="text-sm text-gray-500 mb-4">Paste your copied JSON text here to restore or merge flashcards.</p>
                        <textarea 
                            value={importText} 
                            onChange={(e) => setImportText(e.target.value)} 
                            className="w-full h-40 p-3 border border-gray-200 rounded-xl outline-none focus:border-blue-500 font-mono text-xs mb-3"
                            placeholder='{"folders":[...], "sets":[...], "cards":[...]}'
                        ></textarea>
                        <div className="flex items-center justify-between">
                            <button onClick={handleImport} className="bg-gray-800 text-white px-4 py-2 rounded-lg font-medium hover:bg-gray-900">Import Cards</button>
                            {status && <span className="text-sm font-bold text-emerald-600">{status}</span>}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
